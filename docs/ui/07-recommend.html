<title>추천</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}

.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;text-decoration:none;color:#6B625A}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;box-sizing:border-box;border-radius:999px;border:1px solid #E6DED4;background:#FFFFFF;color:#1E1A16;font-size:14px;text-decoration:none;white-space:nowrap;font-family:inherit}

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FAF7F2; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1E1A16; overflow: hidden">
<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 20px">
<h1 style="margin: 0; font-size: 20px; font-weight: 700">추천</h1>
</header>
<main style="flex: 1; overflow-y: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 22px">
<form style="display: flex; flex-direction: column; gap: 20px; padding: 18px 16px; background: #FFFFFF; border: 1px solid #E6DED4; border-radius: 16px">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend class="q" style="margin-bottom: 10px">1. 메뉴 타입 <span style="font-weight: 400; color: #6B625A">(필수)</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" class="chip on">커피</button>
<button type="button" class="chip">논커피 라떼</button>
<button type="button" class="chip">차</button>
<button type="button" class="chip">에이드·스무디</button>
<button type="button" class="chip">디저트</button>
</div>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 10px">
<label for="budget" class="q">2. 예산</label>
<div style="display: flex; align-items: center; gap: 8px">
<input id="budget" type="number" value="4000" step="500" style="width: 120px; height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #E6DED4; font-family: inherit; font-size: 15px">
<span style="font-size: 15px">원 이하</span>
</div>
<div style="display: flex; gap: 6px">
<button type="button" class="chip" style="min-height: 36px; font-size: 13px">2,000</button>
<button type="button" class="chip" style="min-height: 36px; font-size: 13px">3,000</button>
<button type="button" class="chip on" style="min-height: 36px; font-size: 13px">4,000</button>
<button type="button" class="chip" style="min-height: 36px; font-size: 13px">5,000</button>
</div>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend class="q" style="margin-bottom: 10px">3. 원하는 맛 <span style="font-weight: 400; color: #6B625A">(최대 3개)</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" class="chip on">고소해요</button>
<button type="button" class="chip">진해요</button>
<button type="button" class="chip">산미가 강해요</button>
<button type="button" class="chip">연해요</button>
<button type="button" class="chip on">가성비 좋아요</button>
</div>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend class="q" style="margin-bottom: 10px">4. 위치</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #E6DED4; border-radius: 12px; overflow: hidden">
<button type="button" style="height: 44px; border: 0; background: #6B3B1F; color: #FFFFFF; font-family: inherit; font-size: 14px">전체</button>
<button type="button" style="height: 44px; border: 0; border-left: 1px solid #E6DED4; background: #FFFFFF; color: #1E1A16; font-family: inherit; font-size: 14px">교내만</button>
<button type="button" style="height: 44px; border: 0; border-left: 1px solid #E6DED4; background: #FFFFFF; color: #1E1A16; font-family: inherit; font-size: 14px">근처만</button>
</div>
</fieldset>
<button type="button" style="height: 52px; border-radius: 14px; border: 0; background: #6B3B1F; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">추천받기</button>
</form>

<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #6B3B1F; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 700">아이스 아메리카노 <span style="font-weight: 400; color: #6B625A">· 카페 A</span></span>
<span style="font-size: 13px"><span style="color: #A85F00; font-weight: 700">★ 4.6</span> · 2,500원</span>
<span style="font-size: 12px; color: #6B3B1F; background: #F3E8DF; border-radius: 6px; padding: 4px 8px; line-height: 1.5">예산 4,000원 이하 · 평점 4.6 (리뷰 12개) · '고소해요' 75%</span>
</span>
</a>
<a href="04-menu.html" style="display: flex; gap: 14px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #E6DED4; border-radius: 14px; text-decoration: none; color: #1E1A16">
<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #F3E8DF; color: #6B3B1F; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 700">아메리카노 <span style="font-weight: 400; color: #6B625A">· 카페 D</span></span>
<span style="font-size: 13px"><span style="color: #A85F00; font-weight: 700">★ 4.3</span> · 2,800원</span>
<span style="font-size: 12px; color: #6B3B1F; background: #F3E8DF; border-radius: 6px; padding: 4px 8px; line-height: 1.5">예산 4,000원 이하 · 평점 4.3 (리뷰 5개) · '고소해요' 60%</span>
</span>
</a>
<a href="04-menu.html" style="display: flex; gap: 14px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #E6DED4; border-radius: 14px; text-decoration: none; color: #1E1A16">
<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #F3E8DF; color: #6B3B1F; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 700">아메리카노 <span style="font-weight: 400; color: #6B625A">· 카페 B</span></span>

<span style="font-size: 12px; color: #6B3B1F; background: #F3E8DF; border-radius: 6px; padding: 4px 8px; line-height: 1.5">예산 4,000원 이하 · 평점 4.1 (리뷰 8개) · '가성비 좋아요' 63%</span>
</span>
